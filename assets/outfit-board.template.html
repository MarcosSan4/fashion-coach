<style>
:root{
  --bg:#f6f4f0; --surface:#ffffff; --surface2:#f0ede7; --ink:#1c1d21; --muted:#6b6d74; --line:#e2ded6;
  --accent:#23407a; --accent-ink:#ffffff; --pass:#2f7a4f; --warn:#a86b12; --fail:#b8332a;
  --stage:#ebe8e3; --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121316; --surface:#1b1d21; --surface2:#23262b; --ink:#ecebe8; --muted:#a2a3a8; --line:#2f3238;
    --accent:#8fb2ee; --accent-ink:#0f1630; --pass:#6cc794; --warn:#e3a94b; --fail:#ef7a70;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#121316; --surface:#1b1d21; --surface2:#23262b; --ink:#ecebe8; --muted:#a2a3a8; --line:#2f3238;
  --accent:#8fb2ee; --accent-ink:#0f1630; --pass:#6cc794; --warn:#e3a94b; --fail:#ef7a70;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:28px;white-space:nowrap}
.hl{display:flex;align-items:center;gap:10px}
.hl .ibtn{padding:7px 8px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60}
.navdrawer{position:fixed;left:0;top:0;bottom:0;width:min(320px,86vw);background:var(--surface);border-right:1px solid var(--line);z-index:61;padding:16px;display:flex;flex-direction:column;gap:4px;overflow:auto;transform:translateX(-102%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.35)}
.navdrawer.open{transform:none}
.nd-h{display:flex;align-items:center;justify-content:space-between;font:600 20px "Iowan Old Style",Palatino,Georgia,serif;margin-bottom:10px}
.nv{all:unset;display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;cursor:pointer;font-size:14.5px}
.nv:hover,.nv:focus-visible{background:var(--surface2)}
.nvi{display:flex;color:var(--muted)}
.nv .cnt{margin-left:auto;font-size:12px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.guide{font-size:13px;color:var(--muted);padding:2px 10px 8px;line-height:1.45}
.guide b{color:var(--ink);font-weight:600}
.guide ul{margin:4px 0 10px;padding-left:16px}
.nd-boards{display:flex;flex-direction:column;margin:0 0 6px 30px;border-left:1px solid var(--line)}
.nd-boards button{all:unset;cursor:pointer;padding:5px 10px;font-size:13px;color:var(--muted);border-radius:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd-boards button:hover,.nd-boards button.on{color:var(--ink);background:var(--surface2)}
.nd-boards .d{font-size:11.5px;opacity:.8;margin-right:6px}
.rate.pend{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.svnote{font-size:11.5px;color:var(--muted);margin-top:4px}
.nd-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px}
.svhead{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin:6px 0 14px}
.svhead h2{font-size:22px;margin-right:auto}
.svhead select{font:inherit;font-size:13px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.compare .sv{position:relative}
.compare .sv .svmeta{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compare .sv .del{position:absolute;top:16px;right:16px;border:0;background:rgba(255,255,255,.85);color:#555;border-radius:8px;padding:5px;display:flex;cursor:pointer;opacity:.75}
.compare .sv .del:hover{opacity:1;color:var(--fail)}
@media (hover:hover){.compare .sv .del{opacity:0;transition:opacity .12s}.compare .sv:hover .del,.compare .sv .del:focus-visible{opacity:.75}.compare .sv .del:hover{opacity:1}}
.editbtn{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 -apple-system,BlinkMacSystemFont,sans-serif;color:var(--accent);background:transparent;border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);border-radius:8px;padding:6px 11px;cursor:pointer}
.editbtn:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}.editbtn .ic{width:1em;height:1em}
.gbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);border-radius:8px;padding:2px 8px;cursor:pointer}
.gbtn .ic{width:.62em;height:.62em;opacity:.6}.gbtn:hover{border-style:solid}.gbtn:hover .ic{opacity:1}
.gbtn.unrated{font:600 13px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}
.title.editing{align-items:center;gap:8px 10px}
.title.editing .nameIn{flex:1 1 100%;min-width:0;font:inherit;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:22px;padding:4px 10px;border-radius:8px;border:1px solid var(--accent);background:var(--surface2);color:var(--ink)}
.title.editing .rateInl{display:flex;align-items:center;gap:8px;flex:1 1 180px}
.title.editing .rateInl input{flex:1;min-width:80px;accent-color:var(--accent)}
.title.editing .rateInl span{font:600 20px/1 "Iowan Old Style",Palatino,Georgia,serif;color:var(--accent);min-width:3ch;font-variant-numeric:tabular-nums}
.title.editing .noteIn{flex:1 1 100%;font:inherit;font-size:13.5px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.editstate{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:8px 0 0;padding:8px 12px;border-radius:10px;font-size:13px}
.editstate.clean{color:var(--muted);background:var(--surface2)}
.editstate.dirty{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);font-weight:600}
.editstate .ic{width:1em;height:1em;vertical-align:-2px;margin-right:4px}
.rate{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.rate.worn{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent);font-weight:600}
.svempty{color:var(--muted);padding:30px 4px}
.hrow{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap}
.hrow .req{flex:1 1 280px;min-width:0;color:var(--muted);font-size:14.5px;line-height:1.35;padding-left:18px;border-left:1px solid var(--line)}
.hrow .req:empty{display:none}
@media (max-width:760px){.hrow .req{border-left:0;padding-left:0;flex-basis:100%;order:3}.hright{order:2}}
.hist{position:relative;display:inline-flex;gap:2px}
.hist .ibtn{padding:6px 7px}
.hist [data-tip]:hover::after,.hist [data-tip]:focus-visible::after{top:calc(100% + 7px);bottom:auto}
.hist [data-tip]:hover::before,.hist [data-tip]:focus-visible::before{top:calc(100% + 2px);bottom:auto;border-top-color:transparent;border-bottom:5px solid var(--ink)}
.histmenu{position:absolute;right:0;top:calc(100% + 8px);width:min(340px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.3);padding:6px;z-index:50;max-height:70vh;overflow:auto}
.histmenu.hidden{display:none}
.histmenu .hm-h{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:6px 8px 4px}
.histmenu button{all:unset;display:block;width:100%;box-sizing:border-box;padding:8px 10px;border-radius:8px;cursor:pointer}
.histmenu button:hover,.histmenu button.on{background:var(--surface2)}
.histmenu button.on{outline:1px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.histmenu .t{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.histmenu .m{font-size:12px;color:var(--muted);display:flex;gap:8px;margin-top:2px}
.histmenu .m b{color:var(--accent);font-weight:600}
.histmenu .sep{height:1px;background:var(--line);margin:6px 4px}
.hright{display:flex;align-items:center;margin-left:auto}
.hctl{display:flex;align-items:center;gap:10px}
.hright .date{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
header .meta{display:flex;gap:10px 12px;flex-wrap:wrap;margin-top:12px;align-items:stretch}
header .meta #wx{display:flex}
header .meta #wx:empty{display:none}
.ic{width:1em;height:1em;flex:none;vertical-align:-.14em}
.wx{display:inline-flex;height:100%;align-items:center;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wx .seg{display:flex;align-items:center;gap:9px;padding:7px 14px}
.wx .seg+.seg{border-left:1px solid var(--line)}
.wx .bub{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.wx .t{font:600 17px/1 -apple-system,BlinkMacSystemFont,sans-serif;font-variant-numeric:tabular-nums}
.wx .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.wx .day .bub{background:color-mix(in srgb,#f2a93b 20%,transparent);color:#d98a14}
.wx .night .bub{background:color-mix(in srgb,#6f7fd8 22%,transparent);color:#6a78d0}
.wx .sea .bub{background:color-mix(in srgb,var(--pass) 16%,transparent);color:var(--pass)}
.wx .arrow{color:var(--muted);padding:0 2px;display:flex;align-items:center}
.wx .arrow+.seg{border-left:0}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:0 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px}
.verdict .ic{color:var(--accent);flex:none;font-size:16px}
.caps .ic{color:var(--warn);margin-right:4px}
.chip .ic{width:.95em;height:.95em}
footer b .ic{color:var(--warn);margin-right:5px}
.search{position:relative;display:flex;flex:1 1 160px;max-width:260px}
.search .ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.filters .search input[type=search]{padding-left:30px;width:100%;max-width:none;flex:1}
.star .ic{fill:currentColor}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.verdict{flex:1 1 320px;min-width:0;display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:14.5px;line-height:1.35;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;box-shadow:var(--shadow)}
.verdict b{color:var(--accent)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 14px}
nav.tabs button{font:inherit;font-size:14px;padding:0;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:stretch;overflow:hidden}
nav.tabs button .tl{padding:7px 13px;display:flex;align-items:center;gap:6px}
nav.tabs button .tg{padding:7px 12px 7px 11px;display:flex;align-items:center;border-left:1px solid color-mix(in srgb,currentColor 30%,transparent);font-variant-numeric:tabular-nums;font-weight:650;font-size:13px;letter-spacing:.01em}
nav.tabs button.win{background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
nav.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs .star{color:var(--accent);font-size:12px}
nav.tabs button.on .star{color:inherit}
.compare .c h3 .star,.panel .title .star{color:var(--accent)}
nav.tabs .x{opacity:.6;margin-left:2px}
nav.tabs .sep{width:1px;background:var(--line);margin:4px 4px}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;align-items:start}

.grid>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

.stage .canvas{background:radial-gradient(ellipse 70% 60% at 50% 38%,#f6f4f0 0%,var(--stage) 70%,#dfdbd4 100%);border-radius:10px;display:flex;justify-content:center;transition:outline .15s;outline:2px dashed transparent;outline-offset:-6px}
.stage .canvas.drop{outline-color:#23407a}
.stage svg.man{width:100%;max-width:360px;height:auto;max-height:76vh;display:block}
.toolbar{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:10px}
.tgrp{display:flex;gap:6px;flex-wrap:wrap}
.toolbar{position:relative}
.wearpop{position:absolute;right:0;bottom:calc(100% + 10px);width:min(320px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.3);padding:14px;z-index:40;display:flex;flex-direction:column;gap:10px}
.wearpop.hidden{display:none}
.wp-h{font-weight:600}
.wp-g{display:flex;align-items:center;gap:10px}
.wp-g input{flex:1;accent-color:var(--accent)}
.wp-g span{font:600 18px/1 "Iowan Old Style",Palatino,Georgia,serif;color:var(--accent);min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}
.wearpop textarea{font:inherit;font-size:13.5px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);resize:vertical}
.wp-a{display:flex;justify-content:flex-end;gap:6px}
.ibtn{position:relative;padding:7px 10px}
.ibtn .ic{width:1.15em;height:1.15em}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);right:0;background:var(--ink);color:var(--bg);font:500 12px/1.2 -apple-system,BlinkMacSystemFont,sans-serif;padding:6px 9px;border-radius:7px;white-space:nowrap;pointer-events:none;z-index:30}
[data-tip]:hover::before,[data-tip]:focus-visible::before{content:"";position:absolute;bottom:calc(100% + 2px);right:13px;border:5px solid transparent;border-top-color:var(--ink);border-bottom:0;pointer-events:none;z-index:30}
.btn{font:inherit;font-size:13px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{background:color-mix(in srgb,var(--accent) 16%,var(--surface2));border-color:color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.panel{padding:18px}
.panel .title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel .grade{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.badge{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.badge.ghost{background:transparent;color:var(--warn);border:1px dashed var(--warn)}
.remixnote{font-size:13px;color:var(--warn);margin-top:2px}
.slots{list-style:none;padding:0;margin:14px 0 4px}
.slots li{display:grid;grid-template-columns:108px 40px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.slots li:first-child{border-top:0}
.slots .sw.add{border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-size:15px}
.slots .sw.add .ic{width:15px;height:15px}
.slots .acts{display:flex;gap:2px}
.slots .acts button{font:inherit;border:0;background:none;color:var(--muted);cursor:pointer;padding:5px;border-radius:6px;display:flex}
.slots .acts .optog{font:inherit;font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);margin-right:2px;align-self:center}
.slots .acts .optog.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.slots .acts button:hover{background:var(--surface2);color:var(--ink)}
.slots .nm{position:relative}
.addq{width:100%;font:inherit;font-size:14px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.addq:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:0;border-color:transparent}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);list-style:none;margin:0;padding:4px;max-height:300px;overflow:auto}
.sugg li{display:grid!important;grid-template-columns:30px 1fr auto!important;gap:9px!important;align-items:center;padding:5px 7px!important;border:0!important;border-radius:7px;cursor:pointer}
.sugg li.hi,.sugg li:hover{background:var(--surface2)}
.sugg li.off{opacity:.55}
.sugg .s{width:30px;height:30px;border-radius:6px;background:var(--stage);overflow:hidden;display:flex}
.sugg .s svg{width:100%;height:100%}
.sugg .f{font-size:11px;color:var(--muted)}
.sugg .none{padding:8px;color:var(--muted);font-size:13px;display:block!important}
.slots .sl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.slots .sw{width:40px;height:40px;border-radius:8px;background:var(--stage);display:flex;align-items:center;justify-content:center;overflow:hidden}
.slots .sw svg{width:100%;height:100%}
.slots .nm{min-width:0;overflow-wrap:anywhere}
.slots .nm small{display:block;color:var(--muted);font-size:12px}
.slots .empty{color:var(--muted);font-style:italic}
.dots{display:flex;gap:5px;margin-top:3px;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.25);cursor:pointer;padding:0}
.dot.on{outline:2px solid var(--accent);outline-offset:1px}
.rm{font:inherit;border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px}
.br{color:var(--muted);font-weight:400}
.prose p{margin:10px 0}
.caps{background:var(--surface2);border-radius:8px;padding:9px 12px;font-size:14px}
.caps b{color:var(--warn)}
h3.sec{font-size:15px;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h3.sec span{font:12px/1 -apple-system,BlinkMacSystemFont,sans-serif;color:var(--muted)}
.gates{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;line-height:1.3;padding:4px 10px;border-radius:14px;border:1px solid;display:inline-flex;gap:6px;align-items:center;max-width:100%;overflow-wrap:anywhere}
.chip .ic{vertical-align:0;flex:none}
.chip.pass{color:var(--pass);border-color:color-mix(in srgb,var(--pass) 40%,transparent);background:color-mix(in srgb,var(--pass) 9%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.chip.fail{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 45%,transparent);background:color-mix(in srgb,var(--fail) 10%,transparent);font-weight:600}
.drawer{margin-top:18px;padding:16px}
.drawer .hint{margin:6px 0 0;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.drawer .head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
.filters select{max-width:100%}
.filters select,.filters input[type=search]{font:inherit;font-size:13px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.filters input[type=search]{min-width:0;flex:1 1 160px;max-width:260px}
.filters label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;margin-top:12px}
.item{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px;cursor:grab;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit;user-select:none}
.item:hover{border-color:var(--muted)}
.item.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.item.ghost{border-style:dashed;border-color:var(--warn)}
.item .pic{background:var(--stage);border-radius:8px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.item .pic svg{width:100%;height:100%}
.item .lb{font-size:12.5px;line-height:1.3}
.item .tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:1px 6px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.tag.red{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 35%,transparent)}
.tag.amb{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.tag.blu{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.compare{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.compare .c{padding:10px;cursor:pointer;text-align:center}
.compare .c:hover{border-color:var(--muted)}
.compare .c .canvas{background:radial-gradient(ellipse 70% 60% at 50% 38%,#f6f4f0 0%,var(--stage) 70%,#dfdbd4 100%);border-radius:10px}
.compare .c .canvas svg{width:100%;height:auto;display:block}
.compare .c h3 .ic{width:.9em;height:.9em}
.compare .c h3{font-size:16px;margin-top:8px}
.compare .c .grade{color:var(--accent);font-variant-numeric:tabular-nums}
.compare .c .gl{display:flex;justify-content:center;gap:4px;margin-top:6px;flex-wrap:wrap}
footer{margin-top:22px;color:var(--muted);font-size:13px}
footer ul{margin:6px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.hidden{display:none!important}
header{position:relative}
@media (max-width:600px){
  nav.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:16px -16px 12px;padding:0 16px;-webkit-overflow-scrolling:touch}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{flex:none}
  .stage svg.man{max-height:62vh}
  .toolbar .btn{padding:6px 8px;font-size:12.5px}
  .tgrp{gap:4px}
  .wx .seg{padding:6px 10px}
  .compare{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .compare .c h3{font-size:14px}
  .histmenu{position:fixed;left:12px;right:12px;top:96px;width:auto}
}
@media (max-width:520px){.slots li{grid-template-columns:40px 1fr auto}.slots .sl{display:none}.panel{padding:14px}.drawer{padding:12px}.items{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}}
</style>

function outfitSVG(o, cls = "man") {

  const hideNeck = necklaceHidden(o);

  const {isOpen, inner} = openState(o);

  if (shoes) s += drawShoes(shoes);

  else { if (bottom) s += lift(drawBottom(bottom)); if (belt) s += drawBelt(belt); if (inner) s += lift(drawTop(inner, false, hip)); }
  if (isOpen) s += lift(drawOpenTop(top, hip));
  for (const a of accs) if (a.shape === "chain" || a.shape === "pendant") s += drawAcc(a);

}

// ---------- gate (the skill's pre-output gate, recomputed live) ----------
function gate(o) {
  const res = [], parts = ["layer", "top", "under", "bottom", "shoes"].filter(k => o[k] && !(k === "layer" && o.layerOn === false) && (k !== "under" || openState(o).isOpen)).map(k => [k, eff(o[k])]);
  const all = [...parts, ...(o.belt ? [["belt", eff(o.belt)]] : []), ...(o.acc || []).map(r => ["acc", eff(r)])];
  const by = Object.fromEntries(parts);
  const loud = all.filter(([, e]) => e.loud === "yes" || flags(e).includes("hero-colour"));
  res.push(loud.length <= 1 ? {l: "pass", t: loud.length ? `One loud element: ${loud[0][1].label}` : "No loud element"} : {l: "fail", t: `${loud.length} loud elements (max one): ${loud.map(([, e]) => e.label).join(", ")}`});
  const big = ["top", "layer"].map(k => by[k]).filter(e => e && e.volume === "oversized");
  if (by.bottom && big.length && by.bottom.volume === "fitted") res.push({l: "fail", t: `Oversized ${big[0].label} over a slim bottom (the NPC look)`});
  else if (by.top && by.bottom) res.push({l: "pass", t: FIT[by.top.volume] < FIT[by.bottom.volume] ? "Fitted top, relaxed bottom" : "Proportion OK"});
  if (by.shoes && by.shoes.volume === "chunky") {
    if (by.bottom && !["relaxed", "oversized"].includes(by.bottom.volume)) res.push({l: "fail", t: `Chunky ${by.shoes.label} under a ${by.bottom.volume} bottom`});
    else res.push({l: "pass", t: "Chunky shoes sit under a relaxed leg"});
  }
  for (const [k, e] of all) {
    const fl = flags(e);
    if ((fl.includes("off-palette-near-face") || fl.includes("warm-near-face")) && ["top", "layer", "acc"].includes(k)) res.push({l: "fail", t: `${e.label} is off-palette near the face`});
    if (fl.includes("round-frames-excluded")) res.push({l: "fail", t: `${e.label}: round frames are excluded`});
    for (const f of fl.filter(f => SUPPRESSED.includes(f))) res.push({l: "warn", t: `${e.label} is ${f.replace(/-/g, " ")}: needs a reason`});
    if (fl.includes("logo")) res.push({l: "warn", t: `${e.label} has a logo: caps the grade`});
    if (fl.includes("end-of-life")) res.push({l: "warn", t: `${e.label} is near end of life`});
    if (fl.includes("gym-register")) res.push({l: "warn", t: `${e.label} caps any outfit near 3.5`});
    if (fl.includes("off-palette") || fl.includes("warm-tone")) res.push({l: "warn", t: `${e.label} is off-palette`});
  }
  if (o.belt && by.bottom && /drawstring|elastic/i.test(by.bottom.desc)) res.push({l: "fail", t: `Belt on a drawstring bottom (${by.bottom.label})`});
  // patterns: two at most, never two of the same family (they would compete at a similar scale)
  const PAT = {stripe: "stripe", hstripe: "stripe", check: "check", houndstooth: "check", geo: "print", graphic: "print"};
  const pats = all.filter(([k, e]) => k !== "acc" && PAT[e.texture]);
  if (pats.length > 2) res.push({l: "fail", t: `${pats.length} patterns (max two): ${pats.map(([, e]) => e.label).join(", ")}`});
  else if (pats.length === 2) {
    const fam = pats.map(([, e]) => PAT[e.texture]);
    res.push(fam[0] === fam[1] ? {l: "fail", t: `Two ${fam[0]} patterns compete: vary the scale or swap one for a solid`} : {l: "warn", t: "Two patterns: keep the scales clearly different and share a colour"});
  }
  const fm = parts.map(([, e]) => e.formality);
  if (fm.length > 1) {
    const sp = Math.max(...fm) - Math.min(...fm);
    res.push(sp <= 1 ? {l: "pass", tip: "Formality runs 1 (loungewear) to 5 (formal); keep every piece within about a point", t: `Formality ${Math.min(...fm)} to ${Math.max(...fm)}`} : {l: sp === 2 ? "warn" : "fail", t: `Formality spread ${Math.min(...fm)} to ${Math.max(...fm)}`});
  }
  const regs = new Set(parts.map(([, e]) => e.register).filter(r => r === "neutral" || r === "earth"));
  if (regs.size > 1) {
    const bridge = parts.find(([, e]) => e.register === "both");
    res.push(bridge ? {l: "warn", t: `Crosses registers, bridged by ${bridge[1].label}`} : {l: "fail", t: "Mixes cool-neutral and cool-earth with no bridge piece"});
  } else if (regs.size === 1) res.push({l: "pass", t: `Committed ${[...regs][0] === "earth" ? "cool-earth" : "cool-neutral"} register`});
  const season = BOARD.season;
  if (season) {
    // a summer piece worn underneath an in-season one is layering, not a mistake
    const ok = k => by[k] && by[k].seasons && by[k].seasons[season] !== false;
    const covered = k => (k === "under" && ok("top")) || (k === "top" && ok("layer"));
    const off = all.filter(([k, e]) => e.seasons && e.seasons[season] === false && !covered(k));
    if (off.length) res.push({l: "warn", t: `Out of season (${season}): ${off.map(([, e]) => e.label).join(", ")}`});
  }
  if (!by.top || !by.bottom || !by.shoes) res.push({l: "warn", t: "Outfit incomplete"});
  return res;
}

// ---------- state ----------
const storeKey = () => "outfitboard:" + BOARD.id;
// one library for every board: saved remixes and worn outfits (browser storage)
const LIBKEY = "outfitboard:library";
let LIB = [];
try { LIB = JSON.parse(localStorage.getItem(LIBKEY) || "[]"); } catch (e) { LIB = []; }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => new Date().toISOString().slice(0, 10);
try {  // fold in remixes saved per board by earlier versions
  if (!localStorage.getItem(LIBKEY + ":migrated")) {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith("outfitboard:") || /theme|library/.test(k)) continue;
      const arr = JSON.parse(localStorage.getItem(k) || "[]"), bid = k.slice(12);
      if (Array.isArray(arr)) arr.forEach(r => r && r.outfit && LIB.push({id: uid(), name: r.name || "Remix", outfit: r.outfit, board: bid, date: today()}));
    }
    localStorage.setItem(LIBKEY + ":migrated", "1");
    localStorage.setItem(LIBKEY, JSON.stringify(LIB));
  }
} catch (e) {}
function saveLib() { try { localStorage.setItem(LIBKEY, JSON.stringify(LIB)); } catch (e) {} if ($("nvCount")) $("nvCount").textContent = allSaved().length; }

function apply(id, cw, target) {

  if (it.slot === "acc") {

  } else if (o[it.slot] && o[it.slot].id === ref.id && o[it.slot].cw === ref.cw && ["layer", "belt"].includes(it.slot)) o[it.slot] = null;

document.addEventListener("click", ev => { if (!ev.target.closest(".hist")) $("histMenu").classList.add("hidden"); });
const stepBoard = d => { const list = BOARDS.filter(b => !b.closet), i = list.findIndex(b => b.id === BOARD.id); if (list[i + d]) loadBoard(list[i + d].id); };
$("prevB").onclick = () => stepBoard(-1);
$("nextB").onclick = () => stepBoard(1);

// deep links: #compare, #slot=shoes, #all (drawer shows every season)
const H = new URLSearchParams(location.hash.slice(1));
$("rmBtn").innerHTML = ic("trash-2"); $("resetBtn").innerHTML = ic("rotate-ccw"); $("saveBtn").innerHTML = ic("bookmark"); $("sendBtn").innerHTML = ic("send"); $("wearBtn").innerHTML = ic("check");
$("themeBtn").innerHTML = ic("sun-moon"); $("menuBtn").innerHTML = ic("menu"); $("navClose").innerHTML = ic("x"); $("nvSavedIc").innerHTML = ic("bookmark"); $("nvLatestIc").innerHTML = ic("star"); $("nvClosetIc").innerHTML = ic("shirt"); $("nvGuideIc").innerHTML = ic("info"); $("svBack").innerHTML = ic("chevron-left") + "Back"; $("nvCount").textContent = allSaved().length; $("histBtn").innerHTML = ic("history"); $("prevB").innerHTML = ic("chevron-left"); $("nextB").innerHTML = ic("chevron-right"); $("qic").outerHTML = ic("search"); $("closetH").innerHTML = ic("shirt") + " Closet";
if (H.has("slot") && SLOTS.includes(H.get("slot"))) state.slot = H.get("slot");
loadBoard(H.has("closet") ? "closet" : H.get("b") || BOARDS[0].id, {opt: H.has("opt") ? +H.get("opt") : null, compare: H.has("compare")});
if (H.has("saved")) { state.view = "saved"; render(); }
else if (H.has("entry")) { const eid = H.get("entry"); if ([...HIST, ...REMX, ...LIB].some(x => x.id === eid)) openEntry(eid); }
else if (H.has("r") && state.saved[+H.get("r")]) select("r" + H.get("r"));
if (H.has("all")) { $("season").value = ""; renderDrawer(); }
</script>
</body>
</html>
